<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logic Lab M.4 — เข้าสู่ระบบ / สมัคร</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav">
    <div class="brand">
      <div class="brand-logo"></div>
      <div><span>Logic Lab</span><small>เกมตรรกะสำหรับ ม.4 | M.4 Logic Game</small></div>
    </div>
  </div>

  <div class="container">
    <div class="hero">
      <div>
        <h1>เริ่มต้นเรียนตรรกศาสตร์อย่างสนุก 🎯</h1>
        <p>แอพเว็บแนวการ์ดสวยๆ สำหรับนักเรียน ม.4 พึ่งเริ่มเรียน มีระบบสมัคร/เข้าสู่ระบบ เลือกห้องเรียน และแดชบอร์ดคุณครู</p>
        <div style="display:flex; gap:10px">
          <a class="btn" href="#auth">เข้าสู่ระบบ</a>
          <a class="btn accent" href="#auth" onclick="document.getElementById('tab-register').click()">สมัครใช้งาน</a>
        </div>
      </div>
      <div class="hero-ill">
        <div class="chip">AND</div>
        <div class="chip">OR</div>
        <div class="chip">NOT</div>
      </div>
    </div>

    <div class="card" id="auth">
      <div class="card-tabs">
        <div class="tab active" id="tab-login">เข้าสู่ระบบ</div>
        <div class="tab" id="tab-register">สมัครใช้งาน</div>
      </div>

      <div id="card-login">
        <form id="loginForm" class="grid cols-2">
          <div class="input">
            <label>ชื่อผู้ใช้ / Username</label>
            <input id="login_user" placeholder="เช่น student หรือ teacher">
          </div>
          <div class="input">
            <label>รหัสผ่าน / Password</label>
            <input id="login_pass" type="password" placeholder="อย่างน้อย 6 ตัวอักษร">
          </div>
          <div>
            <button class="btn" style="width:100%; margin-top:8px">เข้าสู่ระบบ</button>
            <div class="small" id="login_msg" style="margin-top:8px"></div>
          </div>
          
        </form>
      </div>

      <div id="card-register" class="hidden">
        <form id="regForm" class="grid cols-2">
          <div class="input"><label>ชื่อ - นามสกุล</label><input id="reg_name" placeholder="เช่น นราธิป ใจดี"></div>
          <div class="input"><label>ชื่อผู้ใช้ (ไม่ซ้ำ)</label><input id="reg_user" placeholder="เช่น poohhub_m4"></div>
          <div class="input"><label>รหัสผ่าน</label><input id="reg_pass" type="password"></div>
          <div class="input"><label>บทบาท</label>
            <select id="reg_role">
              <option value="student">นักเรียน / Student</option>
              <option value="teacher">คุณครู / Teacher</option>
            </select>
          </div>
          <div><button class="btn success" style="width:100%; margin-top:8px">สมัครใช้งาน</button></div>
          <div class="small" id="reg_msg" style="align-self:center"></div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="card hidden" style="position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:12px 16px;">ข้อความ</div>
  <div class="footer">© 2025 Logic Lab • Thawee Koon</div>

  <script src="app.js"></script>
  <script>TK.initIndex()</script>
</body>
</html>
